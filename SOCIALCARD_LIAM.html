<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Connect</title>
<style>
:root{
  --bg:#120a24; --glass:rgba(38,22,72,.62); --ink:#f4eeff; --muted:#b7a6dd; --line:rgba(190,150,255,.18);
  --ring-gap:#120a24; --blob1:#6a2cff; --blob2:#a21fd0; --blob3:#3a2bb8; --avatar-bg:#24123f;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; display:flex; justify-content:center; overflow-x:hidden;
}
.aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.aurora i{position:absolute; width:70vmax; height:70vmax; max-width:620px; max-height:620px; border-radius:50%; filter:blur(90px); opacity:.55}
.aurora i:nth-child(1){background:var(--blob1); top:-18%; left:-25%; animation:d1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--blob2); bottom:-20%; right:-30%; animation:d2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:var(--blob3); top:38%; left:30%; width:40vmax; height:40vmax; opacity:.35; animation:d1 30s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vw,-8vh) scale(1.1)}}

main{position:relative; z-index:1; width:100%; max-width:440px; padding:44px 18px 36px}
.card{
  background:var(--glass); border:1px solid var(--line); border-radius:32px;
  -webkit-backdrop-filter:blur(22px) saturate(1.4); backdrop-filter:blur(22px) saturate(1.4);
  padding:36px 20px 22px; box-shadow:0 30px 80px -30px rgba(20,0,60,.8);
}
.hero{text-align:center; margin-bottom:28px}
.ring{
  width:132px; height:132px; margin:0 auto 20px; border-radius:50%; padding:4px;
  background:conic-gradient(from 0deg,#8b5cf6,#d946ef,#6d28d9,#a78bfa,#8b5cf6);
  animation:spin 8s linear infinite; box-shadow:0 12px 40px -8px rgba(139,92,246,.6);
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{
  width:100%; height:100%; border-radius:50%; border:5px solid var(--ring-gap);
  background:var(--avatar-bg); overflow:hidden; display:grid; place-items:center;
  animation:spin 8s linear infinite reverse;
  font-size:40px; font-weight:800; letter-spacing:.02em;
}
.avatar span{background:linear-gradient(135deg,#a78bfa,#e879f9); -webkit-background-clip:text; background-clip:text; color:transparent}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
h1{margin:0; font-size:30px; line-height:1.1; font-weight:800; letter-spacing:-.02em}
.role{margin:8px 0 0; font-weight:600; color:var(--muted); font-size:15px}
.bio{margin:12px auto 0; max-width:32ch; font-size:16px; color:var(--ink); opacity:.88}

.links{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.links a{
  position:relative; overflow:hidden; display:flex; align-items:center; gap:14px;
  padding:12px 14px; min-height:72px; border-radius:22px; text-decoration:none; color:var(--ink);
  background:var(--glass); border:1px solid var(--line);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.links a::after{
  content:""; position:absolute; inset:0; transform:translateX(-110%);
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
  transition:transform .6s ease;
}
.links a:hover{transform:translateY(-2px); border-color:rgba(167,139,250,.65); box-shadow:0 14px 30px -14px rgba(139,92,246,.7)}
.links a:hover::after{transform:translateX(110%)}
.links a:active{transform:scale(.98)}
.links a:focus-visible{outline:3px solid #a78bfa; outline-offset:3px}
.icon{flex:none; width:48px; height:48px; border-radius:15px; display:grid; place-items:center; color:#fff; box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.icon svg{width:26px; height:26px}
.ig{background:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 55%,#962fbf 80%,#4f5bd5 100%)}
.fb{background:#1877f2}
.tt{background:#0b0b10}
.tt svg{filter:drop-shadow(2px 1.5px 0 #ff2d55) drop-shadow(-2px -1.5px 0 #25f4ee)}
.txt{display:flex; flex-direction:column; min-width:0; flex:1}
.name{font-weight:700; font-size:18px}
.handle{color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.go{flex:none; width:20px; height:20px; color:var(--muted)}
footer{margin-top:22px; text-align:center; color:var(--muted); font-size:13px}

@media (prefers-reduced-motion: reduce){
  .ring,.avatar,.aurora i{animation:none}
  .links a,.links a::after{transition:none}
}
</style>
</head>
